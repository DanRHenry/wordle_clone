<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordle Clone</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <div id="gameBoard"></div>
    <div id="enterStarterWordMessage">Enter Gameplay Word</div>
    <label for="toggleAlphabet">Switch Keyboard Layout</label>
    <input type="checkbox" id="toggleAlphabet">
    <label for="wordLengthInput">Length</label>
    <input type="number" value="5" max="9" min="1" id="wordLengthInput">
    <label for="totalTriesInput">Tries</label>
    <input type="number" value="6" max="9" min="1" id="totalTriesInput">
    <div id="wordDisplay">
    </div>
    <div id="alphabet">
      <div id="topRow">
      </div>
      <div id="middleRow">
      </div>
      <div id="bottomRow">
      </div>
    </div>
        <button id="submitBtn">Submit</button>

    <script src="./scripts/index.js" type="module"></script>
  </body>
</html>
